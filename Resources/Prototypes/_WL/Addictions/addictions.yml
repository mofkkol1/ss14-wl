- type: alertCategory
  id: Addiction

- type: alert
  id: AlcoholCraving
  name: alerts-alcohol-craving-name
  description: alerts-alcohol-craving-desc
  category: Addiction
  icons:
  - sprite: /Textures/Interface/Alerts/thirst.rsi
    state: thirsty

- type: alert
  id: AlcoholWithdrawal
  name: alerts-alcohol-withdrawal-name
  description: alerts-alcohol-withdrawal-desc
  category: Addiction
  icons:
  - sprite: /Textures/Interface/Alerts/thirst.rsi
    state: parched

- type: addiction
  id: AddictionAlcohol
  satisfyingReagents:
    - Ethanol
  cravingTime: 60        # временно
  withdrawalTime: 120    # временно
  withdrawalSpeedModifier: 0.8  # 20% замедление
  withdrawalEmote: Tremble
  minimumSatisfyingAmount: 1.0  # временно
  withdrawalEmoteInterval: 15   # временно
  cravingAlert: AlcoholCraving
  withdrawalAlert: AlcoholWithdrawal

- type: traitCategory
  id: Addictions
  name: Зависимости
  maxTraitPoints: 4

- type: trait
  id: AlcoholAddiction
  name: trait-alcohol-addiction-name
  description: trait-alcohol-addiction-desc
  category: Addictions
  cost: 2
  components:
  - type: Addiction
    addictionType: AddictionAlcohol
