- type: alertCategory
  id: Addiction

- type: alert
  id: AlcoholCraving
  name: alerts-alcohol-craving-name
  description: alerts-alcohol-craving-desc
  category: Addiction
  icons:
  - sprite: /Textures/_WL/Interface/Alerts/addictions.rsi
    state: alcohol_craving

- type: alert
  id: AlcoholWithdrawal
  name: alerts-alcohol-withdrawal-name
  description: alerts-alcohol-withdrawal-desc
  category: Addiction
  icons:
  - sprite: /Textures/_WL/Interface/Alerts/addictions.rsi
    state: alcohol_withdrawal

- type: alert
  id: CoffeeCraving
  name: alerts-coffee-craving-name
  description: alerts-coffee-craving-desc
  category: Addiction
  icons:
  - sprite: /Textures/_WL/Interface/Alerts/addictions.rsi
    state: coffee_craving

- type: alert
  id: CoffeeWithdrawal
  name: alerts-coffee-withdrawal-name
  description: alerts-coffee-withdrawal-desc
  category: Addiction
  icons:
  - sprite: /Textures/_WL/Interface/Alerts/addictions.rsi
    state: coffee_withdrawal

- type: addiction
  id: AddictionAlcohol
  satisfyingReagents:
    - Ethanol
  cravingTime: 60
  withdrawalTime: 120
  withdrawalSpeedModifier: 0.75  # 25% замедление
  withdrawalEmote: Tremble
  minimumSatisfyingAmount: 3.0
  withdrawalEmoteInterval: 15
  cravingAlert: AlcoholCraving
  withdrawalAlert: AlcoholWithdrawal

- type: addiction
  id: AddictionCoffee
  satisfyingReagents:
    - Coffee
    - CoffeeLiqueur
    - CafeLatte
    - EnergyDrink
  cravingTime: 60
  withdrawalTime: 120
  withdrawalSpeedModifier: 0.9  # 10% замедление
  withdrawalEmote: Yawn
  minimumSatisfyingAmount: 5.0
  withdrawalEmoteInterval: 15
  cravingAlert: CoffeeCraving
  withdrawalAlert: CoffeeWithdrawal

- type: traitCategory
  id: Addictions
  name: Зависимости
  maxTraitPoints: 3

- type: trait
  id: AlcoholAddiction
  name: trait-alcohol-addiction-name
  description: trait-alcohol-addiction-desc
  category: Addictions
  cost: 2
  blacklist:
    components:
      - BorgChassis
  components:
  - type: Addiction
    addictionType: AddictionAlcohol

- type: trait
  id: CoffeeAddiction
  name: trait-coffee-addiction-name
  description: trait-coffee-addiction-desc
  category: Addictions
  cost: 1
  blacklist:
    components:
      - BorgChassis
  components:
  - type: Addiction
    addictionType: AddictionCoffee
